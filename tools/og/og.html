<!doctype html>
<!-- Social preview card (1200x630). Render: node tools/og/render.js -> web/assets/og.png -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Figtree:wght@500;700&family=JetBrains+Mono:wght@600&display=swap">
<style>
* { box-sizing: border-box; }
body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: radial-gradient(circle at 78% 40%, #3a2410 0, #101217 58%); color: #eef0f4; font-family: Figtree, sans-serif; }
.copy { position: absolute; left: 72px; top: 70px; width: 600px; display: grid; gap: 26px; }
.brand { display: flex; align-items: center; gap: 16px; font: 800 44px "Bricolage Grotesque", sans-serif; }
.brand img { width: 64px; height: 64px; }
h1 { margin: 0; font: 800 66px/1.02 "Bricolage Grotesque", sans-serif; letter-spacing: -0.02em; }
h1 em { font-style: normal; color: #ff8a1f; }
p { margin: 0; font-size: 27px; color: #b4bac8; }
.chips { display: flex; gap: 12px; font: 600 20px "JetBrains Mono", monospace; color: #eef0f4; }
.chips span { border: 2px solid #2e3340; border-radius: 10px; padding: 8px 14px; background: #191c23; }
.url { position: absolute; left: 72px; bottom: 44px; font: 600 22px "JetBrains Mono", monospace; color: #ff8a1f; }
.phones { position: absolute; right: 40px; top: 50px; width: 470px; height: 560px; }
.phone { position: absolute; width: 230px; padding: 8px; border-radius: 30px; background: linear-gradient(160deg, #2b303c, #15171d); border: 1px solid #2e3340; box-shadow: 0 30px 60px -20px #000; }
.phone img { display: block; width: 100%; border-radius: 22px; }
.p1 { left: 0; top: 60px; transform: rotate(-6deg); }
.p2 { right: 0; top: 0; transform: rotate(5deg); }
</style>
</head>
<body>
  <div class="copy">
    <div class="brand"><img src="../../web/assets/javaplay-logo.png" alt="">JavaPlay</div>
    <h1>Play old Java phone games <em>free.</em></h1>
    <p>In your browser or on Android, with a real phone keypad.</p>
    <div class="chips"><span>163 free games</span><span>177 KB app</span><span>J2ME</span></div>
  </div>
  <div class="url">javagame-emu.codelove.in</div>
  <div class="phones">
    <div class="phone p1"><img src="../../web/assets/shots/app-bounce.png" alt=""></div>
    <div class="phone p2"><img src="../../web/assets/shots/app-diamondrush.png" alt=""></div>
  </div>
</body>
</html>
