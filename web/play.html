<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>KeyPlay Player</title>
<meta name="description" content="Play J2ME .jar phone games in your browser with KeyPlay. Add a game, play it with the phone keypad, touch or your keyboard, and record gameplay videos.">
<meta name="theme-color" content="#14161c">
<link rel="icon" type="image/png" href="assets/keyplay-logo.png">
<link rel="stylesheet" href="app/app.css">
</head>
<body>
<div id="app" class="app">

  <!-- Home: game library -->
  <section id="home" class="home">
    <header class="appbar">
      <img src="assets/keyplay-logo.png" alt="" width="32" height="32">
      <h1>KeyPlay</h1>
      <button class="icon-btn" id="muteBtn" type="button" aria-label="Sound on or off">
        <svg viewBox="0 0 24 24" class="on"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
        <svg viewBox="0 0 24 24" class="off"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
      </button>
    </header>
    <main class="home-body" id="homeBody">
      <div class="empty" id="empty" hidden>
        <img src="assets/keyplay-logo.png" alt="" width="88" height="88">
        <h2>No games yet</h2>
        <p>Download a Java game (<code>.jar</code>) and add it here. Screen size, rotation and controls are set up automatically.</p>
        <label class="btn primary" for="jarInput">Add a game</label>
        <a class="btn" href="https://mobile.phoneky.com/games/" target="_blank" rel="noopener">Find games on PHONEKY</a>
      </div>
      <div class="grid" id="gameGrid"></div>
      <p class="home-note" id="homeNote" hidden></p>
    </main>
    <label class="fab" for="jarInput" id="fab" aria-label="Add a game"><span>+</span></label>
    <input type="file" id="jarInput" accept=".jar,.jad,application/java-archive,application/x-java-archive,application/octet-stream" multiple>
  </section>

  <!-- Player -->
  <section id="player" class="player" hidden>
    <div id="device" class="device portrait">
      <div class="screen-wrap" id="screenWrap">
        <canvas id="screen" width="240" height="320" tabindex="0" aria-label="Game screen"></canvas>
        <button class="float-menu" id="floatMenu" type="button" aria-label="Game menu"><span class="burger"></span></button>
        <div class="rec-badge" id="recBadge" hidden><span class="dot"></span><span id="recTime">0:00</span></div>
        <div class="toast" id="toast" hidden></div>
      </div>
      <div class="keypad" id="keypad">
        <div class="kp-left">
          <button tabindex="-1" class="k soft" data-key="-6" type="button"><span class="bar-ind"></span><span class="soft-label" id="softL"></span></button>
          <button tabindex="-1" class="k menu" data-action="menu" type="button" aria-label="Game menu"><span class="burger"></span></button>
        </div>
        <div class="dpad" id="dpad" aria-label="Direction pad">
          <span class="arr up"></span><span class="arr right"></span><span class="arr down"></span><span class="arr left"></span>
          <button tabindex="-1" class="ok" data-key="-5" type="button">OK</button>
        </div>
        <div class="kp-right">
          <button tabindex="-1" class="k soft" data-key="-7" type="button"><span class="bar-ind"></span><span class="soft-label" id="softR"></span></button>
          <button tabindex="-1" class="k clear" data-key="-8" type="button">C</button>
        </div>
        <div class="numpad">
          <button tabindex="-1" class="k num" data-key="49" type="button">1<small>&nbsp;</small></button>
          <button tabindex="-1" class="k num" data-key="50" type="button">2<small>abc</small></button>
          <button tabindex="-1" class="k num" data-key="51" type="button">3<small>def</small></button>
          <button tabindex="-1" class="k num" data-key="52" type="button">4<small>ghi</small></button>
          <button tabindex="-1" class="k num" data-key="53" type="button">5<small>jkl</small></button>
          <button tabindex="-1" class="k num" data-key="54" type="button">6<small>mno</small></button>
          <button tabindex="-1" class="k num" data-key="55" type="button">7<small>pqrs</small></button>
          <button tabindex="-1" class="k num" data-key="56" type="button">8<small>tuv</small></button>
          <button tabindex="-1" class="k num" data-key="57" type="button">9<small>wxyz</small></button>
          <button tabindex="-1" class="k num" data-key="42" type="button">*<small>&nbsp;</small></button>
          <button tabindex="-1" class="k num" data-key="48" type="button">0<small>+</small></button>
          <button tabindex="-1" class="k num" data-key="35" type="button">#<small>&nbsp;</small></button>
        </div>
      </div>
    </div>
    <p class="kbd-hint">Keyboard: arrows · Enter = OK · F1 / F2 = soft keys · 0–9 * # · Esc = menu</p>
  </section>

  <div class="modal" id="modal" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="grabber"></div>
      <h2 id="modalTitle"></h2>
      <div id="modalBody"></div>
    </div>
  </div>
</div>

<script src="engine/inflate.js"></script>
<script src="engine/zip.js"></script>
<script src="engine/png.js"></script>
<script src="engine/classfile.js"></script>
<script src="engine/vm.js"></script>
<script src="engine/jlib.js"></script>
<script src="engine/midp-lcdui.js"></script>
<script src="engine/midp-ui.js"></script>
<script src="engine/midp-game.js"></script>
<script src="engine/audio.js"></script>
<script src="engine/midp-misc.js"></script>
<script src="engine/launcher.js"></script>
<script src="app/app.js"></script>
</body>
</html>
