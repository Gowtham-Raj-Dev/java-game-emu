plugins {
    id 'com.android.application'
}

// The game engine + player UI live in ../web (also published as the website).
// They are copied into the APK assets at build time so there is a single source.
def webDir = rootProject.file('../web')
tasks.register('copyWebAssets', Copy) {
    from(webDir) {
        include 'play.html', 'app/**', 'engine/**', 'assets/javaplay-logo.png', 'assets/favicon.svg', 'assets/favicon-32.png', 'assets/codelove-footer.png'
    }
    into layout.projectDirectory.dir('src/main/assets/web')
}
tasks.named('preBuild') { dependsOn 'copyWebAssets' }

android {
    namespace 'in.codelove.keyplay'
    compileSdk 37

    defaultConfig {
        applicationId 'in.codelove.keyplay'
        minSdk 21
        targetSdk 34
        versionCode 9
        versionName '2.5.1'
    }

    signingConfigs {
        release {
            def propsFile = rootProject.file('keystore.properties')
            if (propsFile.exists()) {
                def p = new Properties()
                propsFile.withInputStream { p.load(it) }
                storeFile rootProject.file(p['storeFile'].replace('../', ''))
                storePassword p['storePassword']
                keyAlias p['keyAlias']
                keyPassword p['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (rootProject.file('keystore.properties').exists()) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Release: `gradlew publishApk` builds the signed APK, copies it to web/download/JavaPlay.apk and writes
// web/version.json. Installed apps read version.json on start and send people to the website to update. Bump versionCode first.
def releaseNotes = [
    'Free games: the javaplay.codelove.in/games page right inside the app. Play or tap download and the game goes into My games',
    'Auto rotate: turn your phone and the game screen and keys follow',
    'Update now opens the website and downloads the new app',
    'About and credits always open from the top',
    'Fixed the CodeLove links box on older phones',
]
def relCode = android.defaultConfig.versionCode
def relName = android.defaultConfig.versionName
def relApk = layout.buildDirectory.file('outputs/apk/release/app-release.apk')
tasks.register('publishApk') {
    dependsOn 'assembleRelease'
    doLast {
        def apk = relApk.get().asFile
        new File(webDir, 'download/JavaPlay.apk').bytes = apk.bytes
        def info = [versionCode: relCode, versionName: relName, kb: Math.round(apk.length() / 1024),
                    apk: "https://javaplay.codelove.in/download/JavaPlay.apk?v=${relCode}".toString(), notes: releaseNotes]
        new File(webDir, 'version.json').text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(info)) + '\n'
        println "Published JavaPlay ${relName} (${relCode}), ${info.kb} KB"
    }
}
